<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}" />
    <title>Register Page</title>
</head>
<body>
    <form class="form" method="POST">
        <h1>Register</h1>
        {% if error %}
            <p style="
                color: rgba(255, 0, 0, 0.88);
                text-align: center;
                font-weight: 700;
            ">{{ error }}</p>
        {% endif %}
        <div id="grid-input">
            <div class="form-group">
                <label for="name">UserName : </label>
                <input name="name" type="text" placeholder="Enter Username...." required />
            </div>
            <div class="form-group">
                <label for="email">Email : </label>
                <input name="email" type="email" placeholder="Enter Email...." required />
            </div>
            <div class="form-group">
                <label for="mobile">Mobile : </label>
                <input name="mobile" type="text" placeholder="Enter Mobile...." required />
            </div>
            <div class="form-group">
                <label for="password">Password : </label>
                <input name="password" type="password" placeholder="Enter Password..." required />
            </div>
        </div>
        <button id="register-btn">register</button>
        <p>Already Login ? <a href="{{ url_for('auth.login') }}">Click Here</a></p>
    </form>
</body>
</html>
